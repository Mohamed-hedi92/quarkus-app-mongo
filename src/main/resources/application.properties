# MongoDB Configuration
# For local dev: uses default with auth. For production: set MONGO_URI env var.
quarkus.mongodb.connection-string=${MONGO_URI:mongodb://admin:password@localhost:27017/my-mongodb?authSource=admin}
quarkus.mongodb.database=${MONGO_DB:my-mongodb}

# HTTP
quarkus.http.port=8081

# CORS (replaces manual CorsFilter)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# OpenAPI
quarkus.smallrye-openapi.path=/openapi